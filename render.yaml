services:
  - type: web
    name: siem-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: python manage.py migrate && gunicorn siem_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: siem-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://siem-frontend.onrender.com
      - key: ALLOWED_HOSTS
        value: siem-backend.onrender.com,ai-powered-siems.onrender.com

  - type: web
    name: siem-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://ai-powered-siems.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: siem-db
    databaseName: siem_db
    plan: free
